<table class="approval"><tr>{% for cell in signature.headers %}<th>{{ cell }}</th>{% endfor %}</tr><tr>{% for mark in signature.marks %}<td class="approval-mark-cell">{% if mark.name %}<span class="approval-mark approval-mark--{{ mark.kind }} approval-mark--{{ mark.shape }} approval-mark--variant-{{ mark.variant }} approval-mark--font-{{ mark.font }}">{{ mark.text }}{% for wear in mark.wear %}<i class="approval-stamp-wear{% if wear.round %} approval-stamp-wear--round{% endif %}" style="left:{{ wear.left }}%;top:{{ wear.top }}%;width:{{ wear.width }}mm;height:{{ wear.height }}mm;transform:rotate({{ wear.rotate }}deg)"></i>{% endfor %}</span>{% endif %}</td>{% endfor %}</tr></table>
