[project]
name = "rd2-training-data"
version = "0.1.0"
description = "RD-2: C/S/O 문서 자동 분류기 학습 데이터 구축 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "PyMySQL>=1.1",
    "pymupdf>=1.24",
    "pyhwp>=0.1b15",
    # pyhwp가 six를 실제로 임포트하면서도 자기 패키지 메타데이터에 의존성으로
    # 선언하지 않음(실측: pyhwp만 설치하면 ModuleNotFoundError) — 직접 명시.
    "six>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
