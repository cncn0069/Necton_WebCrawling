[project]
name = "rd2-training-data"
version = "0.1.0"
description = "RD-2: C/S/O 문서 자동 분류기 학습 데이터 구축 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "PyMySQL>=1.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "hwp-hwpx-parser>=1.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.10",
    "Jinja2>=3.1",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"rd2.generators" = [
    "templates/*.html",
    "templates/*.css",
    "templates/bodies/*.html",
    "templates/layouts/*.html",
    "templates/partials/*.html",
    "assets/fonts/*.ttf",
    "assets/fonts/LICENSE",
]
